{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav-onepage" class="greedy-nav" aria-label="Sections">
        <button class="hidden" type="button" aria-label="More sections" aria-expanded="false" aria-controls="nav-more"><span class="navicon"></span></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
  <!-- full-width dropdown for compact mode; filled by assets/js/onepage-nav.js -->
  <div id="nav-more" class="nav-menu">
    <div class="nav-menu__bg" aria-hidden="true"></div>
    <div class="nav-menu__body"><ul class="nav-menu__list"></ul></div>
  </div>
</div>
